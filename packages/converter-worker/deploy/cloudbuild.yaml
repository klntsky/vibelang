timeout: 1800s
serviceAccount: projects/plue-prod-1771780303/serviceAccounts/plue-image-builder@plue-prod-1771780303.iam.gserviceaccount.com
options:
  requestedVerifyOption: VERIFIED
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env: [DOCKER_BUILDKIT=1]
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/plue-prod-1771780303/smithers/effeck-converter-worker
  _REVISION: ""
steps:
  - name: gcr.io/cloud-builders/docker@sha256:bbb3d633c5c2813b2ce5245852979e1d637768f4acfc504d8ece288f91e9b60f
    id: build
    args:
      - build
      - --platform=linux/amd64
      - --label=org.opencontainers.image.revision=${_REVISION}
      - --tag=${_IMAGE}:${_REVISION}
      - --file=packages/converter-worker/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker@sha256:bbb3d633c5c2813b2ce5245852979e1d637768f4acfc504d8ece288f91e9b60f
    id: smoke
    args:
      - run
      - --rm
      - --network=none
      - --cpus=1
      - --memory=512m
      - --pids-limit=256
      - --read-only
      - --tmpfs=/tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000
      - --cap-drop=ALL
      - --security-opt=no-new-privileges
      - --mount=type=bind,source=/workspace,target=/workspace,readonly
      - ${_IMAGE}:${_REVISION}
      - /workspace/packages/converter-worker/test/image-smoke.mjs
images: ["${_IMAGE}:${_REVISION}"]
