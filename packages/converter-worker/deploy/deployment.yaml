apiVersion: apps/v1
kind: Deployment
metadata:
  name: effeck-converter-worker
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: effeck-converter-worker }
  template:
    metadata:
      labels: { app: effeck-converter-worker }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: compiler
          image: us-central1-docker.pkg.dev/plue-prod-1771780303/smithers/effeck-converter-worker@sha256:35959205db8ff1a25e7d69db381189ffbbded8e50b43c3f3f24d9f34741f73f6
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: VIBELANG_WORKER_NETWORK, value: policy }
            - { name: VIBELANG_WORKER_TIMEOUT_MS, value: "10000" }
            - { name: TMPDIR, value: /tmp }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=32" }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: temp, mountPath: /tmp }
          # The server binds only after proveNoEgress succeeds. No shell or exec probe.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: temp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
