# A new, narrow allow rule. Existing Helm-managed policies stay unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: effeck-converter-worker-client
  namespace: smithers
spec:
  podSelector:
    matchLabels:
      app: smithers-api
      app.kubernetes.io/name: smithers
      app.kubernetes.io/instance: smithers
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: default }
          podSelector:
            matchLabels: { app: effeck-converter-worker }
      ports:
        - { protocol: TCP, port: 8080 }
