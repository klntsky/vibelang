# Install only releases published at least 7 days (604800 seconds) ago.
# The compiler peer and its native binaries are published from this repository
# and may be installed immediately; third-party dependencies keep the age gate.
# Bun 1.4.3 skips the age check when a manifest is already cached
# (https://github.com/oven-sh/bun/issues/45831); test/run.sh installs with --no-cache.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "vibelang",
  "vibelang-darwin-arm64",
  "vibelang-darwin-x64",
  "vibelang-linux-arm64",
  "vibelang-linux-x64",
]
